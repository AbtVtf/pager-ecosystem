name: jssdk release

on:
  push:
    tags:
      # Mirrors the cli/v* + pysdk/v* tag conventions.
      # Tag MUST be `jssdk/vX.Y.Z` and X.Y.Z MUST match
      # package.json's `version` — the workflow asserts this and
      # fails fast if they drift.
      - "jssdk/v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack tarball without publishing"
        type: boolean
        default: true

defaults:
  run:
    working-directory: sdk/js

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance + OIDC publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Derive tag version
        id: version
        if: github.event_name == 'push'
        # `jssdk/v1.2.3` -> `1.2.3`
        run: |
          ref="${GITHUB_REF#refs/tags/jssdk/v}"
          echo "version=$ref" >> "$GITHUB_OUTPUT"
          echo "Tag version: $ref"
        shell: bash

      - name: Assert package.json version matches tag
        if: github.event_name == 'push'
        run: |
          want="${{ steps.version.outputs.version }}"
          got=$(node -p "require('./package.json').version")
          if [ "$want" != "$got" ]; then
            echo "::error::Tag jssdk/v$want does not match package.json version $got"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack (always, for inspection / artifact upload)
        run: |
          npm pack
          ls -lh *.tgz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball
          path: sdk/js/*.tgz
          if-no-files-found: error

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
