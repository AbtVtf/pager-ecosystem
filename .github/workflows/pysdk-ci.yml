name: pysdk ci

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/pysdk-ci.yml"
      - ".github/workflows/pysdk-release.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/pysdk-ci.yml"
      - ".github/workflows/pysdk-release.yml"

defaults:
  run:
    working-directory: sdk/python

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mirror the supported-versions matrix in pyproject.toml's
        # classifiers so a dropped Python version trips CI before users
        # hit it on PyPI.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest

  build-check:
    # Validates that sdist + wheel build cleanly and pass `twine check`
    # on every PR — catches metadata regressions before they reach a
    # tagged release where they would block PyPI upload.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist
      - name: twine check
        run: python -m twine check dist/*
