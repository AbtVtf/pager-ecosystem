# Production Redis config for the push-relay deploy (PUSH-009).
#
# Defaults are tuned for the relay's workload:
#  - Persistence ON: a relay restart should not drop ≤7-day-TTL queues.
#  - Hardened ACLs: the relay's connection user has just enough commands to
#    operate the sorted-set queues; the "ops" user is for `redis-cli` access.
#  - No network exposure beyond the compose-managed bridge — combined with
#    the docker-compose.prod.yml not publishing a host port, Redis is
#    reachable only from co-located services.
#
# Override REDIS_RELAY_PASSWORD and REDIS_OPS_PASSWORD via the environment
# of redis-cli or by re-running ACL SETUSER from a sealed secret. NEVER
# commit real passwords to this file. Bring this up via:
#
#   PUSH_RELAY_ADMIN_TOKEN=... REDIS_RELAY_PASSWORD=... REDIS_OPS_PASSWORD=... \
#     docker compose -f docker-compose.prod.yml up -d
#
# Then the operator runs (one-time, after first boot):
#
#   docker compose exec redis redis-cli ACL LOAD
#   docker compose exec redis redis-cli -u "redis://default:<bootstrap>@127.0.0.1:6379" \
#     ACL SETUSER relay on ">$REDIS_RELAY_PASSWORD" ~pageros:push:queue:* \
#       +ping +ZADD +ZREMRANGEBYSCORE +ZCARD +ZRANGE +ZREM +EXPIRE +EVALSHA +EVAL +SCAN
#
# See docs/KEY-ROTATION.md for the full rotation procedure.

appendonly yes
appendfsync everysec
save 60 1
save 300 10

# Bind only to the docker bridge — the compose network is the trust boundary.
bind 0.0.0.0
protected-mode no

# Limit memory so the relay can't blow up the host. 256 MiB headroom on top
# of MaxQueueBytes * expected device count keeps eviction predictable.
maxmemory 1gb
maxmemory-policy noeviction
# noeviction: the relay's Lua script already enforces queue caps; we never
# want Redis to silently drop a key under memory pressure. If you ever hit
# the cap, scale Redis vertically or shard.
