<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PagerOS Simulator</title>
    <style>
      :root {
        --device-w: 480px;
        --device-h: 222px;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: var(--device-w);
        height: var(--device-h);
        background: #000;
        overflow: hidden;
        color: #d0d0d0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #screen {
        position: absolute;
        inset: 0;
        width: var(--device-w);
        height: var(--device-h);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hint {
        position: absolute;
        right: 4px;
        bottom: 2px;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.35);
        padding: 0 3px;
        pointer-events: none;
        letter-spacing: 0.05em;
      }
      #status {
        position: absolute;
        left: 4px;
        bottom: 2px;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.45);
        background: rgba(0, 0, 0, 0.35);
        padding: 0 3px;
        pointer-events: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #input-feed {
        position: absolute;
        left: 4px;
        bottom: 14px;
        font-size: 9px;
        color: rgba(140, 230, 140, 0.85);
        background: rgba(0, 40, 0, 0.45);
        padding: 0 3px;
        pointer-events: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #picker {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        max-height: 60%;
        background: rgba(0, 0, 0, 0.92);
        overflow-y: auto;
        font-size: 10px;
        display: none;
        border-bottom: 1px solid #333;
      }
      #picker.open { display: block; }
      #picker .row {
        padding: 2px 6px;
        white-space: nowrap;
        cursor: pointer;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #picker .row:hover { background: #103060; }
      #picker .row.cat { color: #8be1ff; padding-top: 4px; cursor: default; }
      #picker .row.cat:hover { background: transparent; }

      /* SIM-004 — Direct-mode address bar (Alt+G toggles). Lives above
         the device screen so it never covers any of the 480×222 pixels
         while open; when closed, the screen is unobstructed. */
      #addrbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: none;
        background: rgba(0, 0, 0, 0.92);
        border-bottom: 1px solid #333;
        padding: 3px 4px;
        font-size: 10px;
        color: #d0d0d0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        z-index: 10;
      }
      #addrbar.open { display: flex; gap: 4px; align-items: center; }
      #addrbar input {
        flex: 1;
        font: inherit;
        color: #fff;
        background: #111;
        border: 1px solid #333;
        padding: 1px 4px;
        outline: none;
      }
      #addrbar button {
        font: inherit;
        color: #d0d0d0;
        background: #222;
        border: 1px solid #444;
        padding: 1px 6px;
        cursor: pointer;
      }
      #addrbar button:hover { background: #2a3a5a; }
      #addrbar .mode { color: #8be1ff; }

      /* SIM-005 — Network panel. Overlay on top of the device screen so
         the engineer can review what went over the wire without leaving
         the simulator window. Alt+N toggles. Two columns:
         left = exchange list, right = detail (request / response /
         decoded CBOR). */
      #netpanel {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.96);
        color: #d0d0d0;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        display: none;
        flex-direction: column;
        z-index: 20;
      }
      #netpanel.open { display: flex; }
      #netpanel header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 4px;
        border-bottom: 1px solid #333;
        background: #0a0a0a;
      }
      #netpanel header .title { color: #8be1ff; }
      #netpanel header .spacer { flex: 1; }
      #netpanel header button {
        font: inherit;
        color: #d0d0d0;
        background: #222;
        border: 1px solid #444;
        padding: 0 6px;
        cursor: pointer;
      }
      #netpanel header button:hover { background: #2a3a5a; }
      #netpanel .body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      #netlist {
        flex: 0 0 180px;
        overflow-y: auto;
        border-right: 1px solid #222;
      }
      #netlist .row {
        padding: 1px 4px;
        white-space: nowrap;
        cursor: pointer;
        border-bottom: 1px dotted #222;
        text-overflow: ellipsis;
        overflow: hidden;
      }
      #netlist .row:hover { background: #103060; }
      #netlist .row.selected { background: #1a3a6a; color: #fff; }
      #netlist .row.err { color: #ff8080; }
      #netlist .empty {
        padding: 6px 4px;
        color: rgba(255, 255, 255, 0.45);
        font-style: italic;
      }
      #netdetail {
        flex: 1;
        overflow-y: auto;
        padding: 2px 4px;
      }
      #netdetail .placeholder {
        padding: 6px 4px;
        color: rgba(255, 255, 255, 0.45);
        font-style: italic;
      }
      #netdetail .kv {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 0 6px;
        margin: 2px 0 4px;
      }
      #netdetail .kv .k { color: #8be1ff; }
      #netdetail .kv .v { word-break: break-all; }
      #netdetail h4 {
        margin: 4px 0 2px;
        font-size: 10px;
        color: #ffc870;
        border-top: 1px solid #222;
        padding-top: 2px;
      }
      #netdetail .hdrs {
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 6px;
      }
      #netdetail .hdrs .hn { color: #b0c0d0; }
      #netdetail .hdrs .hv { word-break: break-all; }
      #netdetail pre {
        margin: 2px 0 4px;
        padding: 3px 4px;
        background: #050a0f;
        border: 1px solid #1c2a3a;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 140px;
        overflow: auto;
        font-size: 9px;
      }
      #netdetail .truncated {
        color: #ffc870;
        font-style: italic;
      }

      /* SIM-006 — Proxy panel (Alt+L). A small overlay docked top-right
         that hosts the latency / loss sliders + a mode toggle. Sliders
         use the browser's native `range` input so engineers get exact
         numeric feedback without the panel growing complex; the values
         stream straight to the backend via `proxy_set_config`. */
      #proxypanel {
        position: absolute;
        top: 0;
        right: 0;
        display: none;
        flex-direction: column;
        gap: 2px;
        padding: 3px 4px;
        background: rgba(0, 0, 0, 0.92);
        border-left: 1px solid #333;
        border-bottom: 1px solid #333;
        font-size: 10px;
        color: #d0d0d0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        z-index: 15;
        min-width: 220px;
      }
      #proxypanel.open { display: flex; }
      #proxypanel .row {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #proxypanel .row label {
        flex: 0 0 64px;
        color: #8be1ff;
      }
      #proxypanel .row input[type="range"] {
        flex: 1;
        margin: 0;
      }
      #proxypanel .row .val {
        flex: 0 0 56px;
        text-align: right;
        color: #ffc870;
      }
      #proxypanel .head {
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 1px dotted #333;
        padding-bottom: 2px;
        margin-bottom: 1px;
      }
      #proxypanel .head .title { color: #8be1ff; flex: 1; }
      #proxypanel .head button {
        font: inherit;
        color: #d0d0d0;
        background: #222;
        border: 1px solid #444;
        padding: 0 6px;
        cursor: pointer;
      }
      #proxypanel .head button:hover { background: #2a3a5a; }
      #proxypanel .head .toggle.on {
        color: #b8ffb8;
        border-color: #6c6;
        background: #143014;
      }
    </style>
  </head>
  <body>
    <img id="screen" alt="device screen" />
    <div id="picker" role="listbox" aria-label="PROTO-003 vectors"></div>
    <div id="addrbar">
      <span class="mode">direct</span>
      <input id="addr-url" type="text" spellcheck="false" autocomplete="off" />
      <button id="addr-go">Go</button>
      <button id="addr-close">×</button>
    </div>
    <div id="netpanel" role="dialog" aria-label="SIM-005 network panel">
      <header>
        <span class="title">network</span>
        <span id="net-summary" class="spacer">no exchanges yet</span>
        <button id="net-refresh" title="reload list">↻</button>
        <button id="net-clear" title="clear log">clear</button>
        <button id="net-close" title="close (Alt+N)">×</button>
      </header>
      <div class="body">
        <div id="netlist" role="listbox" aria-label="recent exchanges"></div>
        <div id="netdetail"><div class="placeholder">select an exchange on the left</div></div>
      </div>
    </div>
    <div id="proxypanel" role="dialog" aria-label="SIM-006 proxy controls">
      <div class="head">
        <span class="title">proxy (sim LoRa)</span>
        <button id="proxy-toggle" class="toggle" title="enable proxy mode">off</button>
        <button id="proxy-close" title="close (Alt+L)">×</button>
      </div>
      <div class="row">
        <label for="proxy-latency">latency</label>
        <input id="proxy-latency" type="range" min="0" max="30000" step="100" value="0" />
        <span id="proxy-latency-val" class="val">0 ms</span>
      </div>
      <div class="row">
        <label for="proxy-loss">loss</label>
        <input id="proxy-loss" type="range" min="0" max="50" step="1" value="0" />
        <span id="proxy-loss-val" class="val">0 %</span>
      </div>
    </div>
    <div id="input-feed"></div>
    <div id="status">…</div>
    <div id="hint">Alt+J/K vectors · Alt+P picker · Alt+G direct · Alt+N net · Alt+L proxy · Alt+R reload · Esc=BACK · arrows=encoder</div>
    <script type="module">
      const { invoke } = window.__TAURI__.core;

      const screen = document.getElementById('screen');
      const status = document.getElementById('status');
      const inputFeed = document.getElementById('input-feed');
      const picker = document.getElementById('picker');
      const hint   = document.getElementById('hint');
      const addrbar = document.getElementById('addrbar');
      const addrUrl = document.getElementById('addr-url');
      const addrGo = document.getElementById('addr-go');
      const addrClose = document.getElementById('addr-close');
      const netpanel = document.getElementById('netpanel');
      const netlist = document.getElementById('netlist');
      const netdetail = document.getElementById('netdetail');
      const netSummary = document.getElementById('net-summary');
      const netRefresh = document.getElementById('net-refresh');
      const netClearBtn = document.getElementById('net-clear');
      const netCloseBtn = document.getElementById('net-close');
      const proxypanel = document.getElementById('proxypanel');
      const proxyToggleBtn = document.getElementById('proxy-toggle');
      const proxyCloseBtn = document.getElementById('proxy-close');
      const proxyLatencyEl = document.getElementById('proxy-latency');
      const proxyLatencyVal = document.getElementById('proxy-latency-val');
      const proxyLossEl = document.getElementById('proxy-loss');
      const proxyLossVal = document.getElementById('proxy-loss-val');

      // SIM-006 — Proxy mode mirror of the backend `ProxyConfig`. Kept
      // in sync with sliders; pushed to the backend after each change.
      // The backend echoes back its clamped config so a buggy input
      // can't desync the UI.
      let proxyConfig = {
        enabled: false,
        latency_ms: 0,
        loss_rate: 0.0,
        mtu_bytes: 250,
      };
      // Cumulative count of proxy-simulated drops since the panel was
      // last opened — surfaces in the panel header so engineers can
      // tell at a glance whether the loss slider is actually biting.
      let proxyDroppedTotal = 0;

      let vectors = [];
      let index = 0;

      // SIM-004 — direct-mode state. When `directMode` is true, the
      // simulator renders frames coming from the configured app server
      // instead of PROTO-003 test vectors. The two modes are mutually
      // exclusive at the render layer; the picker / vector controls
      // still work as a dev tool while direct mode is active so the
      // engineer can flip between a live app and a known-good vector.
      let directMode = false;
      const DEFAULT_DIRECT_URL = 'http://localhost:8080/';

      // Populate the vectors[] array + picker UI. Returns true when at
      // least one vector loaded; the caller decides whether to also render
      // the default vector to the screen. Split out of the old
      // `loadVectors()` so SIM-EXT-001 can keep Alt+P/J/K vector tools
      // working in startup-URL mode without painting the default vector
      // on top of the live direct-mode frame.
      async function loadVectorList() {
        try {
          vectors = await invoke('list_vectors');
        } catch (err) {
          status.textContent = `list error: ${err}`;
          return false;
        }
        if (vectors.length === 0) {
          status.textContent = 'no vectors found';
          return false;
        }
        // Default to widget_text_minimal_string if present.
        const preferred = vectors.findIndex(
          (v) => v.name === 'widget_text_minimal_string',
        );
        if (preferred >= 0) index = preferred;
        renderPicker();
        return true;
      }

      async function loadVectors() {
        if (await loadVectorList()) {
          await renderCurrent();
        }
      }

      function renderPicker() {
        picker.innerHTML = '';
        let lastCategory = '';
        vectors.forEach((v, i) => {
          if (v.category !== lastCategory) {
            const cat = document.createElement('div');
            cat.className = 'row cat';
            cat.textContent = `── ${v.category} ──`;
            picker.appendChild(cat);
            lastCategory = v.category;
          }
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.idx = String(i);
          row.textContent = `${v.name} [${v.kind}]`;
          row.onclick = () => {
            index = i;
            picker.classList.remove('open');
            renderCurrent();
          };
          picker.appendChild(row);
        });
      }

      async function renderCurrent() {
        const v = vectors[index];
        if (!v) return;
        try {
          const result = await invoke('render_vector', { name: v.name });
          screen.src = `data:image/png;base64,${result.png_b64}`;
          const errSuffix = result.decode_error
            ? ` ! ${result.decode_error}`
            : '';
          status.textContent = `${index + 1}/${vectors.length} ${v.name}${errSuffix}`;
        } catch (err) {
          status.textContent = `render error: ${err}`;
        }
      }

      // ─────────────────────────────────────────────────────────────
      // SIM-004 — Direct-mode address bar + fetch loop.
      //
      // The backend owns the HTTP transport (`direct.rs`); the frontend
      // is just a thin UI that asks the backend to GO somewhere and
      // displays the rendered Frame. Encoder + ENTER + BACK already
      // arrive here as device InputEvents from SIM-003; only BACK is
      // wired into navigation for now (SIM-005 will add the network
      // panel + form/list interactions).
      // ─────────────────────────────────────────────────────────────

      function showAddrBar() {
        if (!addrUrl.value) addrUrl.value = DEFAULT_DIRECT_URL;
        addrbar.classList.add('open');
        addrUrl.focus();
        addrUrl.select();
      }

      function hideAddrBar() {
        addrbar.classList.remove('open');
      }

      async function applyDirectResult(result) {
        if (!result) return;
        directMode = true;
        screen.src = `data:image/png;base64,${result.png_b64}`;
        const errSuffix = result.decode_error ? ` ! ${result.decode_error}` : '';
        const ct = result.content_type ? ` ${result.content_type}` : '';
        // SIM-006 — when proxy mode is on, the backend annotates each
        // fetch with the simulated fragment / loss / airtime numbers.
        // Hang them off the right side of the status line so it stays
        // readable when the panel is closed.
        const proxySuffix = result.proxy
          ? ` · proxy ${result.proxy.fragments_sent}/${result.proxy.total_fragments}frag ${result.proxy.simulated_latency_ms}ms`
          : '';
        status.textContent =
          `${result.status}${ct} ${result.url} (${result.body_bytes}B)${proxySuffix}${errSuffix}`;
        if (result.proxy && result.proxy.fragments_lost > 0) {
          proxyDroppedTotal += result.proxy.fragments_lost;
          if (proxypanel.classList.contains('open')) {
            updateProxyHeader();
          }
        }
        if (netpanel.classList.contains('open')) {
          // Don't blow away the selection — the engineer may be reading
          // the previous exchange while a new one lands.
          refreshNetList({ keepSelection: true });
        }
      }

      async function directGo(url) {
        try {
          await invoke('direct_set_base_url', { url });
          const result = await invoke('direct_fetch', {
            path: '/',
            method: 'GET',
          });
          hideAddrBar();
          await applyDirectResult(result);
        } catch (err) {
          status.textContent = `direct error: ${err}`;
          if (netpanel.classList.contains('open')) {
            refreshNetList({ keepSelection: true });
          }
        }
      }

      async function directBack() {
        try {
          const result = await invoke('direct_back');
          if (result) {
            await applyDirectResult(result);
            return true;
          }
        } catch (err) {
          status.textContent = `direct back error: ${err}`;
          if (netpanel.classList.contains('open')) {
            refreshNetList({ keepSelection: true });
          }
        }
        return false;
      }

      // ─────────────────────────────────────────────────────────────
      // SIM-005 — Network panel.
      //
      // Reads `network_exchanges` / `network_exchange` / `network_clear`
      // from the backend. Auto-refreshes on every direct-mode fetch so
      // the engineer sees new traffic without manually reloading.
      // ─────────────────────────────────────────────────────────────

      let netSelectedId = null;
      let netLastExchanges = [];

      function fmtBytes(n) {
        if (n < 1024) return `${n}B`;
        if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)}KiB`;
        return `${(n / 1024 / 1024).toFixed(1)}MiB`;
      }

      function hexPreview(bytes, max = 256) {
        if (!bytes) return '';
        const arr = Array.from(bytes);
        const slice = arr.slice(0, max);
        let out = '';
        for (let i = 0; i < slice.length; i += 16) {
          const chunk = slice.slice(i, i + 16);
          const hex = chunk.map((b) => b.toString(16).padStart(2, '0')).join(' ');
          const ascii = chunk
            .map((b) => (b >= 0x20 && b < 0x7f ? String.fromCharCode(b) : '.'))
            .join('');
          out += `${i.toString(16).padStart(4, '0')}  ${hex.padEnd(47, ' ')}  ${ascii}\n`;
        }
        if (arr.length > max) {
          out += `… ${arr.length - max} more byte(s)\n`;
        }
        return out;
      }

      function renderHeaders(headers) {
        if (!headers || headers.length === 0) {
          return '<div class="placeholder">(none)</div>';
        }
        return (
          '<div class="hdrs">' +
          headers
            .map(
              (h) =>
                `<div class="hn">${escapeHtml(h.name)}:</div>` +
                `<div class="hv">${escapeHtml(h.value)}</div>`,
            )
            .join('') +
          '</div>'
        );
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      async function refreshNetList(opts) {
        const keepSelection = opts && opts.keepSelection;
        try {
          netLastExchanges = await invoke('network_exchanges');
        } catch (err) {
          netSummary.textContent = `network log error: ${err}`;
          return;
        }
        netSummary.textContent =
          netLastExchanges.length === 0
            ? 'no exchanges yet'
            : `${netLastExchanges.length} exchange(s)`;
        netlist.innerHTML = '';
        if (netLastExchanges.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'no traffic captured';
          netlist.appendChild(empty);
          netdetail.innerHTML =
            '<div class="placeholder">select an exchange on the left</div>';
          netSelectedId = null;
          return;
        }
        for (const ex of netLastExchanges) {
          const row = document.createElement('div');
          const isErr = ex.outcome && ex.outcome.kind === 'error';
          row.className = 'row' + (isErr ? ' err' : '');
          row.dataset.id = String(ex.id);
          const status =
            ex.outcome.kind === 'response' ? ex.outcome.status : 'ERR';
          row.textContent = `${status} ${ex.method} ${pathOf(ex.url)} · ${ex.latency_ms}ms`;
          row.title = ex.url;
          row.onclick = () => selectExchange(ex.id);
          netlist.appendChild(row);
        }
        if (!keepSelection || netSelectedId == null) {
          // Default to newest.
          await selectExchange(netLastExchanges[0].id);
        } else {
          const stillThere = netLastExchanges.find((e) => e.id === netSelectedId);
          if (stillThere) {
            highlightSelected();
          } else {
            await selectExchange(netLastExchanges[0].id);
          }
        }
      }

      function pathOf(url) {
        try {
          const u = new URL(url);
          return u.pathname + (u.search || '');
        } catch {
          return url;
        }
      }

      function highlightSelected() {
        for (const row of netlist.querySelectorAll('.row')) {
          row.classList.toggle(
            'selected',
            row.dataset.id === String(netSelectedId),
          );
        }
      }

      async function selectExchange(id) {
        netSelectedId = id;
        highlightSelected();
        let detail;
        try {
          detail = await invoke('network_exchange', { id });
        } catch (err) {
          netdetail.innerHTML = `<div class="placeholder">load error: ${escapeHtml(String(err))}</div>`;
          return;
        }
        if (!detail) {
          netdetail.innerHTML =
            '<div class="placeholder">exchange evicted from log</div>';
          return;
        }
        renderDetail(detail);
      }

      function renderDetail(d) {
        const ex = d;
        const ts = new Date(Number(ex.started_at_ms || 0)).toISOString().slice(11, 23);
        const out = [];
        out.push('<div class="kv">');
        out.push(`<div class="k">when</div><div class="v">${escapeHtml(ts)} UTC</div>`);
        out.push(`<div class="k">transport</div><div class="v">${escapeHtml(ex.transport)}</div>`);
        out.push(`<div class="k">method</div><div class="v">${escapeHtml(ex.method)}</div>`);
        out.push(`<div class="k">url</div><div class="v">${escapeHtml(ex.url)}</div>`);
        out.push(`<div class="k">latency</div><div class="v">${ex.latency_ms} ms</div>`);
        if (ex.outcome.kind === 'response') {
          out.push(`<div class="k">status</div><div class="v">${ex.outcome.status}</div>`);
        } else {
          out.push(
            `<div class="k">error</div><div class="v">${escapeHtml(ex.outcome.error_kind)}: ${escapeHtml(ex.outcome.message)}</div>`,
          );
        }
        out.push('</div>');

        out.push('<h4>request headers</h4>');
        out.push(renderHeaders(ex.request_headers));

        out.push('<h4>request body</h4>');
        if (ex.request_body.bytes_len === 0) {
          out.push('<div class="placeholder">(no body)</div>');
        } else {
          out.push(bodyBlock(ex.request_body, ex.request_decoded));
        }

        if (ex.outcome.kind === 'response') {
          out.push('<h4>response headers</h4>');
          out.push(renderHeaders(ex.outcome.response_headers));
          out.push('<h4>response body</h4>');
          if (ex.outcome.response_body.bytes_len === 0) {
            out.push('<div class="placeholder">(no body)</div>');
          } else {
            out.push(bodyBlock(ex.outcome.response_body, ex.response_decoded));
          }
        }

        netdetail.innerHTML = out.join('');
      }

      function bodyBlock(body, decoded) {
        const totalSize = body.bytes_len;
        const truncNote = body.truncated
          ? `<div class="truncated">… showing first ${fmtBytes(body.bytes.length)} of ${fmtBytes(totalSize)}</div>`
          : '';
        const hex = hexPreview(body.bytes);
        const dec = decoded || '';
        return [
          `<div class="kv"><div class="k">size</div><div class="v">${fmtBytes(totalSize)}</div></div>`,
          truncNote,
          '<div class="kv"><div class="k">raw (hex)</div><div class="v"></div></div>',
          `<pre>${escapeHtml(hex)}</pre>`,
          '<div class="kv"><div class="k">decoded</div><div class="v"></div></div>',
          `<pre>${escapeHtml(dec || '(no decode)')}</pre>`,
        ].join('');
      }

      function toggleNetPanel() {
        if (netpanel.classList.contains('open')) {
          netpanel.classList.remove('open');
        } else {
          netpanel.classList.add('open');
          refreshNetList();
        }
      }

      // ─────────────────────────────────────────────────────────────
      // SIM-006 — Proxy panel.
      //
      // Reads `proxy_state` once at startup to pick up backend-clamped
      // values, then pushes `proxy_set_config` after each slider change.
      // The backend echoes back the (possibly clamped) config so the UI
      // can't drift outside the modeled envelope. Loss slider uses a
      // 0..50 integer mapping to a 0..0.5 float to keep the UI obvious.
      // ─────────────────────────────────────────────────────────────

      function formatProxyLatency(ms) {
        if (ms < 1000) return `${ms} ms`;
        return `${(ms / 1000).toFixed(ms % 1000 === 0 ? 0 : 1)} s`;
      }

      function formatProxyLoss(rate) {
        return `${Math.round(rate * 100)} %`;
      }

      function updateProxyHeader() {
        const dropNote = proxyDroppedTotal > 0
          ? ` · drops:${proxyDroppedTotal}`
          : '';
        proxyToggleBtn.textContent = proxyConfig.enabled ? `on${dropNote}` : 'off';
        proxyToggleBtn.classList.toggle('on', !!proxyConfig.enabled);
      }

      function reflectProxyConfig() {
        proxyLatencyEl.value = String(proxyConfig.latency_ms);
        proxyLatencyVal.textContent = formatProxyLatency(proxyConfig.latency_ms);
        // Loss slider is a 0..50 int representing 0..50% — multiply by 0.01.
        proxyLossEl.value = String(Math.round(proxyConfig.loss_rate * 100));
        proxyLossVal.textContent = formatProxyLoss(proxyConfig.loss_rate);
        updateProxyHeader();
      }

      async function pushProxyConfig(next) {
        try {
          const echoed = await invoke('proxy_set_config', { config: next });
          proxyConfig = echoed;
        } catch (err) {
          status.textContent = `proxy config error: ${err}`;
          return;
        }
        reflectProxyConfig();
      }

      async function loadProxyConfig() {
        try {
          proxyConfig = await invoke('proxy_state');
        } catch (err) {
          // Wiring bug — log it but don't block startup. Sliders stay
          // at their HTML defaults so the engineer can still drive.
          status.textContent = `proxy state error: ${err}`;
        }
        reflectProxyConfig();
      }

      function toggleProxyPanel() {
        if (proxypanel.classList.contains('open')) {
          proxypanel.classList.remove('open');
        } else {
          // Reset the drops counter when the panel reopens so the
          // displayed value tracks "this debugging session", not the
          // entire process lifetime.
          proxyDroppedTotal = 0;
          updateProxyHeader();
          proxypanel.classList.add('open');
        }
      }

      proxyLatencyEl.addEventListener('input', () => {
        const ms = parseInt(proxyLatencyEl.value, 10) | 0;
        proxyLatencyVal.textContent = formatProxyLatency(ms);
        pushProxyConfig({ ...proxyConfig, latency_ms: ms });
      });
      proxyLossEl.addEventListener('input', () => {
        const pct = parseInt(proxyLossEl.value, 10) | 0;
        const rate = pct / 100;
        proxyLossVal.textContent = formatProxyLoss(rate);
        pushProxyConfig({ ...proxyConfig, loss_rate: rate });
      });
      proxyToggleBtn.addEventListener('click', () => {
        pushProxyConfig({ ...proxyConfig, enabled: !proxyConfig.enabled });
      });
      proxyCloseBtn.addEventListener('click', () => {
        proxypanel.classList.remove('open');
      });

      netRefresh.addEventListener('click', () => refreshNetList({ keepSelection: true }));
      netClearBtn.addEventListener('click', async () => {
        try {
          await invoke('network_clear');
        } catch (err) {
          netSummary.textContent = `clear error: ${err}`;
          return;
        }
        netSelectedId = null;
        await refreshNetList();
      });
      netCloseBtn.addEventListener('click', () => netpanel.classList.remove('open'));

      addrGo.addEventListener('click', () => directGo(addrUrl.value));
      addrClose.addEventListener('click', hideAddrBar);
      addrUrl.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          ev.stopPropagation();
          directGo(addrUrl.value);
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          ev.stopPropagation();
          hideAddrBar();
        }
      });

      // ─────────────────────────────────────────────────────────────
      // SIM-003 — host keyboard → device InputEvent dispatch.
      //
      // Most keys emit on keydown so the device reacts immediately. BACK
      // (Escape) emits on keyup with a press_ms stamp so the Rust mapper
      // can distinguish Back from BackLong per SPEC.md §5.6.2.
      //
      // Dev shortcuts (vector picker, reload, hint toggle) live behind
      // the Alt modifier so they never collide with device input.
      // ─────────────────────────────────────────────────────────────

      const escapeDown = new Map(); // key id → epoch ms when pressed

      function showEvent(ev) {
        if (!ev) {
          inputFeed.textContent = '';
          return;
        }
        let label;
        switch (ev.kind) {
          case 'char':       label = ev.value === ' ' ? 'SPACE' : ev.value; break;
          case 'backspace':  label = 'BKSP'; break;
          case 'encoder':    label = `ENC ${ev.value > 0 ? '+' : ''}${ev.value}`; break;
          case 'enter':      label = 'ENT'; break;
          case 'back':       label = 'BACK'; break;
          case 'back_long':  label = 'BACK·HOLD'; break;
          default:           label = ev.kind;
        }
        inputFeed.textContent = label;
      }

      async function dispatchHostKey(ev, eventType, pressMs) {
        const host = {
          key: ev.key,
          code: ev.code,
          event_type: eventType,
          shift: ev.shiftKey,
          ctrl: ev.ctrlKey,
          alt: ev.altKey,
          meta: ev.metaKey,
          repeat: ev.repeat,
          press_ms: pressMs | 0,
        };
        try {
          const result = await invoke('dispatch_input', { host });
          if (result) {
            showEvent(result);
            await handleDeviceEvent(result);
          }
          return result;
        } catch (err) {
          status.textContent = `input error: ${err}`;
          return null;
        }
      }

      // Route device InputEvents into direct-mode navigation. For now
      // only BACK is wired (matches `SPEC.md` §5.4.1: BACK is the only
      // event the device emits eagerly without app interaction).
      // SIM-005 will route encoder/ENTER through a focus model.
      async function handleDeviceEvent(ev) {
        if (!directMode) return;
        if (ev.kind === 'back' || ev.kind === 'back_long') {
          await directBack();
        }
      }

      function isAltDevShortcut(ev) {
        return ev.altKey && !ev.ctrlKey && !ev.metaKey;
      }

      window.addEventListener('keydown', async (ev) => {
        // Dev-only shortcuts (Alt-gated). These never reach the device.
        if (isAltDevShortcut(ev)) {
          switch (ev.code) {
            case 'KeyJ':
              index = (index + 1) % vectors.length;
              renderCurrent();
              ev.preventDefault();
              return;
            case 'KeyK':
              index = (index - 1 + vectors.length) % vectors.length;
              renderCurrent();
              ev.preventDefault();
              return;
            case 'KeyP':
              picker.classList.toggle('open');
              ev.preventDefault();
              return;
            case 'KeyR':
              if (directMode) {
                directGo(addrUrl.value || DEFAULT_DIRECT_URL);
              } else {
                renderCurrent();
              }
              ev.preventDefault();
              return;
            case 'KeyH':
              hint.style.display = hint.style.display === 'none' ? '' : 'none';
              status.style.display = hint.style.display;
              ev.preventDefault();
              return;
            case 'KeyG':
              if (addrbar.classList.contains('open')) {
                hideAddrBar();
              } else {
                showAddrBar();
              }
              ev.preventDefault();
              return;
            case 'KeyN':
              toggleNetPanel();
              ev.preventDefault();
              return;
            case 'KeyL':
              toggleProxyPanel();
              ev.preventDefault();
              return;
          }
        }

        // While the network panel is open, keys are for browsing the
        // panel, not the device — let the browser handle scroll / clicks
        // and swallow everything else.
        if (netpanel.classList.contains('open')) {
          return;
        }

        // While the proxy panel is open, slider keystrokes belong to
        // the panel; swallow device input until it closes.
        if (proxypanel.classList.contains('open')) {
          return;
        }

        // While the address bar is open, key handling stays inside the
        // input field — don't forward to the device.
        if (addrbar.classList.contains('open')) {
          return;
        }

        // Closing the picker with Escape is a UI concern, not a device
        // BACK press. Swallow the Escape so it doesn't double-fire.
        if (picker.classList.contains('open') && ev.key === 'Escape') {
          picker.classList.remove('open');
          ev.preventDefault();
          return;
        }

        // Track Escape press time so keyup can compute press_ms.
        if (ev.key === 'Escape' && !ev.repeat) {
          escapeDown.set(ev.code || ev.key, performance.now());
        }

        const result = await dispatchHostKey(ev, 'key_down', 0);
        if (result) ev.preventDefault();
      });

      window.addEventListener('keyup', async (ev) => {
        if (ev.key !== 'Escape') return;
        const downAt = escapeDown.get(ev.code || ev.key);
        escapeDown.delete(ev.code || ev.key);
        const pressMs = downAt == null ? 0 : Math.max(0, performance.now() - downAt);
        const result = await dispatchHostKey(ev, 'key_up', Math.round(pressMs));
        if (result) ev.preventDefault();
      });

      // SIM-EXT-001 — startup boot. If the simulator was launched with
      // `PAGEROS_SIMULATOR_URL` set, drop straight into direct mode against
      // that URL (skipping the vector-picker default) so `pagerctl
      // simulate <url>` / `pagerctl dev` can spawn the simulator and have
      // it "open onto" the right app without any keyboard driving.
      // Vector dev tooling (Alt+P/J/K) still works either way — the
      // vectors list is populated regardless so an engineer can flip back.
      async function init() {
        // SIM-006 — pull live proxy config first so the panel reflects
        // backend state when first opened, even if the engineer never
        // touches the sliders.
        await loadProxyConfig();
        let startup = null;
        try {
          startup = await invoke('startup_url');
        } catch (err) {
          // Backend wired wrong; fall back to today's behavior rather
          // than blocking startup. Surface to status so it's diagnosable.
          status.textContent = `startup_url error: ${err}`;
        }
        if (startup) {
          // Populate vectors in the background; never paint the default
          // vector on top of the live direct-mode frame.
          loadVectorList();
          addrUrl.value = startup;
          await directGo(startup);
        } else {
          await loadVectors();
        }
      }

      init();
    </script>
  </body>
</html>
